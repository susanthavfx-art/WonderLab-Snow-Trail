# Build and deploy the Vite game to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# `actions: write` is needed to clean up stale Pages artifacts before uploading.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build game
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Re-runs of the same workflow run keep appending `github-pages` artifacts,
      # which makes deploy-pages fail with "Multiple artifacts named
      # github-pages". Clear any leftovers from earlier attempts first.
      - name: Remove stale Pages artifacts
        # Best effort: if this is blocked the deploy below still decides the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id') || exit 0
          for id in $ids; do
            echo "Deleting stale github-pages artifact $id"
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id" || true
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # The upload above finishes a moment before the artifact is queryable, and
      # deploy-pages fails outright if it does not see it yet. Wait for it.
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 30); do
            id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n1)
            if [ -n "$id" ]; then
              echo "Found github-pages artifact $id"
              exit 0
            fi
            echo "Waiting for the github-pages artifact ($attempt/30)"
            sleep 4
          done
          echo "Artifact never appeared" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # Pages sometimes answers "Deployment failed, try again later" for a
      # perfectly good artifact. Give the same artifact one more chance before
      # the job is called failed. Note the condition reads the *conclusion*:
      # continue-on-error keeps the step flagged successful even when it failed.
      - name: Retry deploy once
        if: steps.deployment.conclusion != 'success'
        id: deployment-retry
        uses: actions/deploy-pages@v5

